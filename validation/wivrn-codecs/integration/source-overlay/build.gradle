buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

allprojects {
  repositories {
      google()
      mavenCentral()
  }
}

apply plugin: 'com.android.application'
layout.buildDirectory = layout.projectDirectory.dir('build/android')


import javax.inject.Inject
import org.gradle.api.DefaultTask
import org.gradle.api.tasks.*
import org.gradle.api.file.DirectoryProperty
import org.gradle.process.ExecOperations

abstract class GeneratePngsTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOps()

    @InputFile
    abstract RegularFileProperty getSvg()

    @InputFile
    @Optional
    abstract RegularFileProperty getCss()

    @InputFile
    @Optional
    abstract RegularFileProperty getRaster()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def outDir = getOutputDir().get().asFile
        outDir.mkdirs()

        // Map of density → size
        def dpiConfigs = [
            "mipmap-mdpi"   : 48,
            "mipmap-hdpi"   : 72,
            "mipmap-xhdpi"  : 96,
            "mipmap-xxhdpi" : 144,
            "mipmap-xxxhdpi": 192
        ]

        def cssFile = getCss().isPresent() ? getCss().get().asFile : null

        dpiConfigs.each { dpi, size ->
            def dpiDir = new File(outDir, dpi)
            dpiDir.mkdirs()

            def outputFile = new File(dpiDir, "ic_wivrn_launcher.png")

            if (getRaster().isPresent()) {
                def source = javax.imageio.ImageIO.read(getRaster().get().asFile)
                if (source == null) throw new GradleException('Cannot read Meta app icon')
                def scaled = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_RGB)
                def graphics = scaled.createGraphics()
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.drawImage(source, 0, 0, size, size, null)
                graphics.dispose()
                javax.imageio.ImageIO.write(scaled, 'png', outputFile)
                return
            }

            def argsList = [
                getSvg().get().asFile.absolutePath,
                "-w", size.toString(),
                "-h", size.toString(),
                "-o", outputFile.absolutePath
            ]
            if (cssFile != null) {
                argsList.add("--stylesheet=${cssFile.absolutePath}")
            }

            execOps.exec {
                executable = "rsvg-convert"
                args = argsList
            }
        }
    }
}

tasks.register("generatePngs", GeneratePngsTask) {
    group = "Custom"

    // configure defaults
    svg.set(layout.projectDirectory.file("images/wivrn.svg"))
    outputDir.set(layout.buildDirectory.dir("generated_resources"))
    if (project.hasProperty('wivrn_meta_icon')) {
        raster.set(layout.projectDirectory.file('images/wivrn-pro-meta-icon.png'))
    }

    if (project.hasProperty("wivrn_css")) {
        css.set(layout.projectDirectory.file(project.wivrn_css))
    } else {
        css.set(layout.projectDirectory.file("images/wivrn-local.css"))
    }
}

def use_asan = project.hasProperty('wivrn_address_sanitizer') && wivrn_address_sanitizer == 'ON'
// Private store signing material stays outside the source tree and command line.
def releaseStore = System.getenv('WIVRN_SIGNING_STORE')
def releasePassword = System.getenv('WIVRN_SIGNING_PASSWORD')

android {
    namespace = "org.meumeu.wivrn"
    ndkVersion = "29.0.14206865"

    lint {
        disable += "ExpiredTargetSdkVersion"
    }

    defaultConfig {
        applicationId "org.meumeu.wivrn"
        // for Vulkan, need at least 24
        // for AImage_getHardwareBuffer, API 26
        minSdkVersion 29
        compileSdkVersion 34
        targetSdkVersion 32 // for Oculus Store

        versionName = project.hasProperty('wivrn_version') ? wivrn_version : "1.0"
        versionCode = project.hasProperty('wivrn_versionCode') ? wivrn_versionCode.toInteger() : 1
        def showImguiDemo = project.hasProperty('wivrn_show_imgui_demo') ? wivrn_show_imgui_demo : 'OFF'
        def showDebugMenu = project.hasProperty('wivrn_show_debug_menu') ? wivrn_show_debug_menu : 'OFF'
        def compressGlb = project.hasProperty('wivrn_compress_glb') ? wivrn_compress_glb : 'OFF'
        def fetchcontentBaseDir = project.hasProperty('fetchcontent_base_dir') ? ['-DFETCHCONTENT_BASE_DIR=' + fetchcontent_base_dir] : []

        def asan = use_asan ? 'ON': 'OFF'
        def stl = use_asan ? 'c++_shared' : "c++_static"

        externalNativeBuild {
            def css = project.hasProperty('wivrn_css') ? project.wivrn_css: "images/wivrn-local.css"

            cmake {
                arguments  = ['-DANDROID_TOOLCHAIN=clang',
                          '-DWIVRN_CODEC_TESTS=' + (project.hasProperty('wivrn_codec_tests') ? 'ON' : 'OFF'),
                          '-DCMAKE_JOB_POOLS=compile=4;link=2', '-DCMAKE_JOB_POOL_COMPILE=compile', '-DCMAKE_JOB_POOL_LINK=link',
                          '-DANDROID_STL=' + stl,
                          '-DCMAKE_ANDROID_NDK_VERSION=' + ndkVersion,
                          '-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON',
                          '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
                          '-DCMAKE_ANDROID_ASSETS_DIRECTORIES=' + layout.buildDirectory.dir("assets").get().asFile,
                          '-DRESOURCES_DIRECTORIES=' + layout.buildDirectory.dir("resources").get().asFile,
                          '-DWIVRN_USE_SYSTEM_BOOST=OFF',
                          '-DWIVRN_USE_SYSTEM_FREETYPE=OFF',
                          '-DWIVRN_USE_ANDROID_BIN_LIBKTX=ON',
                          '-DWIVRN_BUILD_CLIENT=ON',
                          '-DWIVRN_BUILD_SERVER=OFF',
                          '-DWIVRN_BUILD_SERVER_LIBRARY=OFF',
                          '-DWIVRN_BUILD_WIVRNCTL=OFF',
                          '-DWIVRN_BUILD_DASHBOARD=OFF',
                          '-DWIVRN_WERROR=ON',
                          '-DWIVRN_SHOW_IMGUI_DEMO_WINDOW=' + showImguiDemo,
                          '-DWIVRN_CLIENT_DEBUG_MENU=' + showDebugMenu,
                          '-DWIVRN_CSS=' + css,
                          '-DWIVRN_COMPRESS_GLB=' + compressGlb,
                          '-DWIVRN_ADDRESS_SANITIZER=' + asan,
                          '-DWIVRN_AUDIO_AB_STOCK=' + (project.findProperty('wivrn_audio_ab_stock') ?: 'ON'),
                          ] +
                          fetchcontentBaseDir + (project.hasProperty('wivrn_offline') ? ['-DFETCHCONTENT_FULLY_DISCONNECTED=ON'] : [])
                resValue "string", "app_name", project.hasProperty('wivrn_app_name') ? project.wivrn_app_name : "WiVRn Pro"
                abiFilters 'arm64-v8a'//, 'x86_64'
            }

        }
        packaging {
            jniLibs {
                useLegacyPackaging = use_asan
            }
        }
    }

    signingConfigs {
        if (releaseStore && releasePassword) {
            metaRelease {
                storeFile file(releaseStore)
                keyAlias System.getenv('WIVRN_SIGNING_ALIAS') ?: 'wivrn-pro'
                storePassword releasePassword
                keyPassword releasePassword
                enableV2Signing = true
            }
        }
        if (project.hasProperty("signingKeyPassword")) {
            release {
                storeFile file("ks.keystore")
                keyAlias "default_key"
                storePassword signingKeyPassword // Set in gradle.properties
                keyPassword signingKeyPassword
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        if (project.hasProperty("signingKeyPassword")) {
            release {
                signingConfig = signingConfigs.release
            }
        }

        release {
            if (releaseStore && releasePassword) signingConfig = signingConfigs.metaRelease
            manifestPlaceholders.ComOculusSupportedDevices = "questpro"
            applicationIdSuffix = project.hasProperty("wivrn_codec_tests") ? ".codectest" : ".spatial"
        }

        releaseDebuggable {
            initWith release
            debuggable true

            // Uncomment to have debug symbols
//             packagingOptions {
//                 doNotStrip "*/arm64-v8a/*.so"
//                 doNotStrip "*/armeabi-v7a/*.so"
//                 doNotStrip "*/x86/*.so"
//                 doNotStrip "*/x86_64/*.so"
//             }
        }

        oculus
        {
            initWith release
            applicationIdSuffix = project.hasProperty("wivrn_codec_tests") ? ".codectest" : ".spatial"
            manifestPlaceholders.ComOculusSupportedDevices = "questpro"
        }

        debug {
            applicationIdSuffix = project.hasProperty("wivrn_codec_tests") ? ".codectest" : ".spatial"
            manifestPlaceholders.ComOculusSupportedDevices = "questpro"
        }

        debugWithValidationLayer {
            initWith debug
            externalNativeBuild {
                cmake {
                    arguments '-DWIVRN_USE_ANDROID_VALIDATION_LAYER=ON'
                }
            }
        }
    }

    buildTypes.all { variant ->
        sourceSets {
            "${variant.name}" {
                jniLibs.srcDirs layout.buildDirectory.dir("libs${variant.name.capitalize()}")
            }
        }

        externalNativeBuild{
            cmake {
                arguments '-DANDROID_LIB_DIRECTORIES=' + layout.buildDirectory.dir("libs${variant.name.capitalize()}").get().asFile
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['client/java']
            res.srcDirs = [ 'resources', layout.buildDirectory.dir('generated_resources') ]
            resources.srcDirs = [layout.buildDirectory.dir('resources')]

            assets.srcDirs = ['assets', layout.buildDirectory.dir("assets")]
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.31.5'
            path    'CMakeLists.txt'
        }
    }

    tasks["preBuild"].dependsOn "generatePngs"

    applicationVariants.all { variant ->
        // It probably works with merge${variant.name.capitalize()}Assets too
        tasks["generate${variant.name.capitalize()}Assets"].dependsOn "externalNativeBuild${variant.name.capitalize()}"
        tasks["merge${variant.name.capitalize()}Resources"].dependsOn "externalNativeBuild${variant.name.capitalize()}"
    }
}
