name: Neural intra codec CPU smoke
on:
  push:
    branches: ['research/sub15-20261009/neural-intra-codec']
    paths:
      - 'validation/wivrn-codecs/neural_intra_codec/**'
      - 'validation/wivrn-codecs/research_workflow/**'
      - '.github/workflows/neural-intra-codec.yml'
  pull_request:
    paths:
      - 'validation/wivrn-codecs/neural_intra_codec/**'
      - 'validation/wivrn-codecs/research_workflow/**'
      - '.github/workflows/neural-intra-codec.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Codec and workflow contract tests
        run: |
          python3 -m unittest discover -s validation/wivrn-codecs/neural_intra_codec -p 'test_*.py' -v
          python3 -m unittest discover -s validation/wivrn-codecs/research_workflow -p 'test_*.py' -v
      - name: Tiny synthetic training and independent decode
        run: python3 validation/wivrn-codecs/neural_intra_codec/smoke.py --output-dir "$RUNNER_TEMP/neural-intra-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-intra-cpu-smoke
          path: ${{ runner.temp }}/neural-intra-smoke
          if-no-files-found: ignore
