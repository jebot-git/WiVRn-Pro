name: Neural experiment ranker
on:
  workflow_dispatch:
  push:
    branches:
      - research/sub15-20261009/neural-experiment-ranker
    paths:
      - validation/wivrn-codecs/neural_experiment_ranker/**
      - validation/wivrn-codecs/research_workflow/**
      - .github/workflows/neural-experiment-ranker.yml
  pull_request:
    paths:
      - validation/wivrn-codecs/neural_experiment_ranker/**
      - validation/wivrn-codecs/research_workflow/**
      - .github/workflows/neural-experiment-ranker.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Meaningful model, split, provenance and CLI checks
        run: python -m unittest discover -s validation/wivrn-codecs/neural_experiment_ranker -p 'test_*.py' -v
      - name: Preserve shared workflow contract
        run: python -m unittest discover -s validation/wivrn-codecs/research_workflow -p 'test_*.py' -v
      - name: CLI help
        run: python validation/wivrn-codecs/neural_experiment_ranker/ranker.py --help
      - name: Synthetic end-to-end artifacts
        run: python validation/wivrn-codecs/neural_experiment_ranker/demo.py --out /tmp/ranker-synthetic-ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ranker-plumbing-only
          path: /tmp/ranker-synthetic-ci
