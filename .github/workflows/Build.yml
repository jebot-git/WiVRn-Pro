name: WiVRn Pro offline builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        qsv: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ cargo rustc pkg-config libboost-all-dev libssl-dev libvulkan-dev glslang-tools spirv-tools libopenxr-dev libavcodec-dev libavutil-dev libbsd-dev libavahi-client-dev libavahi-glib-dev libeigen3-dev nlohmann-json3-dev librsvg2-dev libdrm-dev libglib2.0-dev-bin libpipewire-0.3-dev libcli11-dev libnotify-dev libarchive-dev libudev-dev libwayland-dev libxrandr-dev libsystemd-dev libvpl2
      - name: Capture, IPC, fork policy and merge-safety tests
        run: fork/test-offline.sh
      - name: Shora protocol and reconnect tests
        run: cargo test --locked --manifest-path server/shora/Cargo.toml
      - name: Build server and OpenXR runtime
        run: fork/build-server.sh -DWIVRN_USE_QSV=${{ matrix.qsv }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
  quest-pro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools librsvg2-bin gettext
          curl -fL -o /tmp/ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          sudo dpkg -i /tmp/ktx.deb
      - name: Build Quest Pro APK (no deployment)
        run: fork/build-client.sh
      - uses: actions/upload-artifact@v7
        with:
          name: quest-pro-debug
          path: build/android/outputs/apk/debug/*.apk
  dashboard:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libvulkan-dev glslang-tools spirv-tools libssl-dev libboost-all-dev gettext extra-cmake-modules libarchive-dev libkf6coreaddons-dev libkf6i18n-dev libkf6qqc2desktopstyle-dev libkf6iconthemes-dev libkirigami-dev librsvg2-dev nlohmann-json3-dev qcoro-qt6-dev qml6-module-org-kde-kirigamiaddons-formcard qt6-declarative-private-dev qt6-base-private-dev
      - name: Build dashboard
        run: |
          cmake -S . -B build/dashboard -G Ninja -DWIVRN_BUILD_SERVER=OFF -DWIVRN_BUILD_SERVER_LIBRARY=OFF -DWIVRN_BUILD_WIVRNCTL=OFF -DWIVRN_BUILD_DASHBOARD=ON -DWIVRN_WERROR=ON
          cmake --build build/dashboard --target wivrn-dashboard -j4
