name: WiVRn Pro offline builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        qsv: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ cargo rustc pkg-config libboost-all-dev libssl-dev libvulkan-dev glslang-tools spirv-tools libopenxr-dev libavcodec-dev libavutil-dev libbsd-dev libavahi-client-dev libavahi-glib-dev libeigen3-dev nlohmann-json3-dev librsvg2-dev libdrm-dev libglib2.0-dev-bin libpipewire-0.3-dev libcli11-dev libnotify-dev libarchive-dev libudev-dev libwayland-dev libxrandr-dev libsystemd-dev libvpl2 python3-venv python3-gi dbus-daemon libinput-dev libasound2-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libxext-dev
      - name: Qt Python runtime
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r dashboard/shora/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Capture, IPC, fork policy and merge-safety tests
        run: fork/test-offline.sh
      - name: Shora protocol and reconnect tests
        run: cargo test --workspace --locked --manifest-path server/shora/Cargo.toml
      - name: Build server and OpenXR runtime
        run: fork/build-server.sh -DWIVRN_USE_QSV=${{ matrix.qsv }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Upstream WayVR tests (no XR session)
        run: cargo test --locked --release --manifest-path server/wayvr/upstream/Cargo.toml -p wayvr --no-default-features --features openxr,wayland,x11
      - name: Staged combined service package
        run: |
          DESTDIR="$PWD/build/package-wayvr" cmake --install build/server
          python3 fork/tests/wayvr_package.py
      - name: Integrated tracking worker and Qt IPC (simulated only)
        run: |
          python3 fork/tests/tracking_worker_smoke.py --server build/server/server/wivrn-pro-server
          dbus-run-session -- python3 fork/tests/dashboard_dbus_smoke.py
  quest-pro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools librsvg2-bin gettext
          curl -fL -o /tmp/ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          sudo dpkg -i /tmp/ktx.deb
      - name: Build Quest Pro APK (no deployment)
        run: fork/build-client.sh
      - uses: actions/upload-artifact@v7
        with:
          name: quest-pro-debug
          path: build/android/outputs/apk/debug/*.apk
