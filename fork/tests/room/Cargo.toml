[package]
name = "wivrn-room-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Exercise the production room reader/math without Vulkan, a compositor or HMD.
[workspace]

[dependencies]
glam = { version = "0.30.9", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"
